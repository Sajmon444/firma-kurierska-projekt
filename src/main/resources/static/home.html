<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel główny</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid #cccccc;
            margin-bottom: 20px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button,
        .btn-link {
            padding: 6px 12px;
            background-color: #eeeeee;
            border: 1px solid #999999;
            font-size: 14px;
            color: #000000;
            text-decoration: none;
            cursor: pointer;
        }

        .columns {
            display: flex;
            gap: 20px;
        }

        .column {
            flex: 1;
            border: 1px solid #cccccc;
            padding: 16px;
            min-height: 400px;
        }

        .column h2 {
            font-size: 18px;
            margin-top: 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #cccccc;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <span>Zalogowany jako: <strong id="username">Użytkownik</strong></span>
            <a id="send-package-link" href="/doreczenie/nadaj-paczke.html" class="btn-link">Nadaj paczkę</a>
        </div>
        <div class="top-bar-right">
            <a href="/rejestracja/logowanie.html" class="btn-link">Wyloguj się</a>
        </div>
    </div>

    <div class="columns">
        <div class="column">
            <h2>Paczki nadane</h2>
            <div id="sent-packages">Brak nadanych paczek.</div>
        </div>

        <div class="column">
            <h2>Paczki oczekujące</h2>
            <div id="expected-packages">Brak oczekujących paczek.</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const login = params.get('login');
        if (login) {
            document.getElementById('username').textContent = login;
            document.getElementById('send-package-link').href = '/doreczenie/nadaj-paczke.html?login=' + encodeURIComponent(login);

            fetch('/api/doreczenie/paczki?login=' + encodeURIComponent(login))
                .then(response => response.json())
                .then(data => {
                    renderPackages('sent-packages', data.sent, 'Brak nadanych paczek.');
                    renderPackages('expected-packages', data.expected, 'Brak oczekujących paczek.');
                });
        }

        function renderPackages(containerId, packages, emptyText) {
            const container = document.getElementById(containerId);
            if (!packages || packages.length === 0) {
                container.textContent = emptyText;
                return;
            }

            container.innerHTML = '';
            packages.forEach(pkg => {
                const item = document.createElement('div');
                item.style.border = '1px solid #dddddd';
                item.style.padding = '10px';
                item.style.marginBottom = '10px';
                item.style.fontSize = '14px';

                const deliveryInfo = pkg.deliveryType === 'LOCKER'
                    ? 'Paczkomat: ' + (pkg.lockerCode || '') + ', ' + (pkg.lockerCity || '')
                    : 'Adres: ' + (pkg.street || '') + ', ' + (pkg.postalCode || '') + ' ' + (pkg.city || '');

                item.innerHTML =
                    '<strong>Odbiorca:</strong> ' + escapeHtml(pkg.recipientName) + ' (' + escapeHtml(pkg.recipientPhone) + ')<br>' +
                    '<strong>Dostawa:</strong> ' + escapeHtml(deliveryInfo) + '<br>' +
                    '<strong>Paczka:</strong> ' + escapeHtml(pkg.packageSize) + ', ' + pkg.weight + ' kg<br>' +
                    '<strong>Status:</strong> ' + escapeHtml(pkg.status);

                container.appendChild(item);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
