<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Nadaj paczkę</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Nadanie paczki</h1>

        <form action="#" method="post">
            <h2>Dane odbiorcy</h2>

            <div class="form-group">
                <label for="recipientName">Imię i nazwisko odbiorcy</label>
                <input type="text" id="recipientName" name="recipientName" required>
            </div>

            <div class="form-group">
                <label for="recipientPhone">Numer telefonu odbiorcy</label>
                <input type="tel" id="recipientPhone" name="recipientPhone" required>
            </div>

            <div class="form-group">
                <label for="recipientEmail">Adres e-mail odbiorcy</label>
                <input type="email" id="recipientEmail" name="recipientEmail">
            </div>

            <h2>Sposób dostawy</h2>

            <div class="radio-group">
                <label>
                    <input type="radio" name="deliveryType" value="HOME" checked>
                    Dostawa pod dom
                </label>
                <label>
                    <input type="radio" name="deliveryType" value="LOCKER">
                    Paczkomat
                </label>
            </div>

            <div id="home-address-section">
                <div class="form-group">
                    <label for="street">Ulica i numer domu/mieszkania</label>
                    <input type="text" id="street" name="street" required>
                </div>

                <div class="form-group">
                    <label for="postalCode">Kod pocztowy</label>
                    <input type="text" id="postalCode" name="postalCode" placeholder="00-000" required>
                </div>

                <div class="form-group">
                    <label for="city">Miejscowość</label>
                    <input type="text" id="city" name="city" required>
                </div>
            </div>

            <div id="locker-section" class="hidden">
                <div class="form-group">
                    <label for="lockerCode">Kod paczkomatu</label>
                    <input type="text" id="lockerCode" name="lockerCode" placeholder="np. KRA01M">
                </div>

                <div class="form-group">
                    <label for="lockerCity">Miejscowość paczkomatu</label>
                    <input type="text" id="lockerCity" name="lockerCity">
                </div>
            </div>

            <h2>Dane paczki</h2>

            <div class="form-group">
                <label for="packageSize">Gabaryt paczki</label>
                <select id="packageSize" name="packageSize" required>
                    <option value="SMALL">Mała (gabaryt A)</option>
                    <option value="MEDIUM">Średnia (gabaryt B)</option>
                    <option value="LARGE">Duża (gabaryt C)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="weight">Waga (kg)</label>
                <input type="number" id="weight" name="weight" step="0.1" min="0.1" required>
            </div>

            <div class="form-group">
                <label for="notes">Uwagi do przesyłki (opcjonalnie)</label>
                <textarea id="notes" name="notes" rows="3"></textarea>
            </div>

            <button type="submit">Nadaj paczkę</button>
        </form>

        <div class="link">
            <a id="back-link" href="/home.html">Powrót do panelu głównego</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const login = params.get('login');
        if (login) {
            document.getElementById('back-link').href = '/home.html?login=' + encodeURIComponent(login);
        }

        const deliveryRadios = document.querySelectorAll('input[name="deliveryType"]');
        const homeSection = document.getElementById('home-address-section');
        const lockerSection = document.getElementById('locker-section');

        const homeInputs = homeSection.querySelectorAll('input');
        const lockerInputs = lockerSection.querySelectorAll('input');

        deliveryRadios.forEach(function (radio) {
            radio.addEventListener('change', function () {
                if (this.value === 'HOME') {
                    homeSection.classList.remove('hidden');
                    lockerSection.classList.add('hidden');
                    homeInputs.forEach(input => input.required = true);
                    lockerInputs.forEach(input => input.required = false);
                } else {
                    homeSection.classList.add('hidden');
                    lockerSection.classList.remove('hidden');
                    homeInputs.forEach(input => input.required = false);
                    lockerInputs.forEach(input => input.required = true);
                }
            });
        });
    </script>
</body>
</html>
